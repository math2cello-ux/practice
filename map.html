<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greater Boston Clean Energy Equity Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      :root {
        --ink: #1d2f2b;
        --muted: #61716d;
        --line: #dce4df;
        --panel: rgba(255, 255, 255, 0.94);
        --green: #28784e;
        --blue: #287a9f;
        --gold: #d59b2d;
        --rose: #b84d5d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #map {
        position: fixed;
        inset: 0;
      }

      .panel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 2;
        width: min(380px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 40px rgba(29, 47, 43, 0.16);
        backdrop-filter: blur(14px);
      }

      .panel-header {
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--green);
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        line-height: 1.15;
      }

      .panel-header p:last-child {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .control-section {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
      }

      .control-section:last-child {
        border-bottom: 0;
      }

      .section-title {
        display: block;
        margin-bottom: 10px;
        font-size: 0.78rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
      }

      label {
        color: var(--ink);
        font-size: 0.92rem;
        font-weight: 700;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--green);
      }

      input[type="range"],
      select {
        width: 100%;
      }

      select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        padding: 0 10px;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 700;
      }

      .legend {
        display: grid;
        gap: 8px;
      }

      .legend-row {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 9px;
        align-items: center;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .swatch {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(0, 0, 0, 0.14);
        border-radius: 4px;
      }

      .status {
        position: absolute;
        right: 16px;
        bottom: 24px;
        z-index: 2;
        max-width: min(420px, calc(100vw - 32px));
        border-radius: 8px;
        background: rgba(29, 47, 43, 0.88);
        color: white;
        padding: 10px 12px;
        font-size: 0.9rem;
      }

      .status.hidden {
        display: none;
      }

      .maplibregl-popup-content {
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--ink);
        box-shadow: 0 14px 36px rgba(29, 47, 43, 0.18);
      }

      .popup-title {
        margin: 0 0 8px;
        font-weight: 850;
      }

      .popup-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 8px;
        margin: 4px 0;
        font-size: 0.88rem;
      }

      .popup-row span:first-child {
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .panel {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
          max-height: 48vh;
        }

        .status {
          right: 10px;
          bottom: 20px;
          left: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Greater Boston clean energy equity map"></div>

    <aside class="panel" aria-label="Map controls">
      <div class="panel-header">
        <p class="eyebrow">Greater Boston</p>
        <h1>Clean Energy Equity Map</h1>
        <p>
          Visualize socioeconomic vulnerability, environmental justice block
          groups, EV charging stations, and municipal solar adoption.
        </p>
      </div>

      <div class="control-section">
        <span class="section-title">Tract Choropleth</span>
        <select id="tractMetric">
          <option value="svi_rpl_themes">Social Vulnerability Index</option>
          <option value="poverty_rate">Poverty Rate</option>
          <option value="renter_rate">Renter Rate</option>
          <option value="no_vehicle_rate">No Vehicle Rate</option>
          <option value="median_household_income">Median Household Income</option>
          <option value="multifamily_share">Multifamily Housing Share</option>
        </select>
        <div class="row">
          <label for="tractsToggle">Show census tracts</label>
          <input id="tractsToggle" type="checkbox" checked />
        </div>
        <input
          id="tractOpacity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.68"
          aria-label="Census tract opacity"
        />
      </div>

      <div class="control-section">
        <span class="section-title">Energy Layers</span>
        <div class="row">
          <label for="evToggle">EV charging stations</label>
          <input id="evToggle" type="checkbox" checked />
        </div>
        <div class="row">
          <label for="solarToggle">Municipal solar adoption</label>
          <input id="solarToggle" type="checkbox" checked />
        </div>
        <div class="row">
          <label for="ejToggle">Environmental justice block groups</label>
          <input id="ejToggle" type="checkbox" checked />
        </div>
      </div>

      <div class="control-section">
        <span class="section-title">Legend</span>
        <div id="legend" class="legend"></div>
      </div>
    </aside>

    <div id="status" class="status">Loading GeoJSON layers...</div>

    <script>
      const files = {
        tracts: "data/geojson/greater_boston_tracts_acs_svi.geojson",
        ev: "data/geojson/greater_boston_ev_charging_stations.geojson",
        ej: "data/geojson/greater_boston_ej_blockgroups.geojson",
        solar: "data/geojson/greater_boston_solar_pts_by_municipality.geojson",
      };

      const tractMetrics = {
        svi_rpl_themes: {
          label: "Social Vulnerability Index",
          format: percentRank,
          stops: [0, 0.25, 0.5, 0.75, 1],
          colors: ["#f7fbf7", "#d9ead9", "#95c99b", "#4c9a68", "#16643f"],
        },
        poverty_rate: {
          label: "Poverty Rate",
          format: percent,
          stops: [0, 0.1, 0.2, 0.35, 0.5],
          colors: ["#f7fbf7", "#d9ead9", "#95c99b", "#4c9a68", "#16643f"],
        },
        renter_rate: {
          label: "Renter Rate",
          format: percent,
          stops: [0, 0.25, 0.5, 0.75, 1],
          colors: ["#f7fbf7", "#d9ead9", "#95c99b", "#4c9a68", "#16643f"],
        },
        no_vehicle_rate: {
          label: "No Vehicle Rate",
          format: percent,
          stops: [0, 0.1, 0.2, 0.35, 0.5],
          colors: ["#f7fbf7", "#d9ead9", "#95c99b", "#4c9a68", "#16643f"],
        },
        median_household_income: {
          label: "Median Household Income",
          format: currency,
          stops: [30000, 60000, 90000, 130000, 180000],
          colors: ["#16643f", "#4c9a68", "#d9ead9", "#f1c36d", "#b86b2d"],
        },
        multifamily_share: {
          label: "Multifamily Housing Share",
          format: percent,
          stops: [0, 0.25, 0.5, 0.75, 1],
          colors: ["#f7fbf7", "#d9ead9", "#95c99b", "#4c9a68", "#16643f"],
        },
      };

      const map = new maplibregl.Map({
        container: "map",
        style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
        center: [-71.08, 42.34],
        zoom: 9,
        attributionControl: true,
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");
      map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-left");

      const statusEl = document.getElementById("status");
      const legendEl = document.getElementById("legend");
      const tractMetricEl = document.getElementById("tractMetric");

      let activeTractMetric = tractMetricEl.value;

      map.on("load", async () => {
        try {
          const [tracts, ev, ej, solar] = await Promise.all([
            loadGeoJSON(files.tracts),
            loadGeoJSON(files.ev),
            loadGeoJSON(files.ej),
            loadGeoJSON(files.solar),
          ]);

          addSources({ tracts, ev, ej, solar });
          addLayers();
          addInteractions();
          wireControls();
          updateTractPaint();
          updateLegend();
          fitToData(tracts);
          statusEl.classList.add("hidden");
        } catch (error) {
          statusEl.textContent =
            "Could not load local GeoJSON files. Run this page from a local web server, for example: python3 -m http.server 8000";
          console.error(error);
        }
      });

      async function loadGeoJSON(path) {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`${path}: ${response.status}`);
        }
        return response.json();
      }

      function addSources(data) {
        map.addSource("tracts", { type: "geojson", data: data.tracts });
        map.addSource("ev", { type: "geojson", data: data.ev });
        map.addSource("ej", { type: "geojson", data: data.ej });
        map.addSource("solar", { type: "geojson", data: data.solar });
      }

      function addLayers() {
        map.addLayer({
          id: "tracts-fill",
          type: "fill",
          source: "tracts",
          paint: {
            "fill-color": "#d9ead9",
            "fill-opacity": 0.68,
          },
        });

        map.addLayer({
          id: "tracts-outline",
          type: "line",
          source: "tracts",
          paint: {
            "line-color": "#62706c",
            "line-width": 0.45,
            "line-opacity": 0.55,
          },
        });

        map.addLayer({
          id: "solar-fill",
          type: "fill",
          source: "solar",
          paint: {
            "fill-color": [
              "interpolate",
              ["linear"],
              ["coalesce", ["to-number", ["get", "solar_capacity_dc_mw"]], 0],
              0,
              "rgba(255,255,255,0)",
              10,
              "#f5d58a",
              50,
              "#d79b2b",
              120,
              "#9c5b16",
            ],
            "fill-opacity": 0.48,
          },
        });

        map.addLayer({
          id: "solar-outline",
          type: "line",
          source: "solar",
          paint: {
            "line-color": "#9c5b16",
            "line-width": 0.8,
            "line-opacity": 0.4,
          },
        });

        map.addLayer({
          id: "ej-fill",
          type: "fill",
          source: "ej",
          filter: ["==", ["get", "EJ"], "Yes"],
          paint: {
            "fill-color": "#b84d5d",
            "fill-opacity": 0.2,
          },
        });

        map.addLayer({
          id: "ej-outline",
          type: "line",
          source: "ej",
          filter: ["==", ["get", "EJ"], "Yes"],
          paint: {
            "line-color": "#b84d5d",
            "line-width": 0.75,
            "line-opacity": 0.68,
          },
        });

        map.addLayer({
          id: "ev-points",
          type: "circle",
          source: "ev",
          paint: {
            "circle-radius": [
              "interpolate",
              ["linear"],
              ["coalesce", ["to-number", ["get", "ev_dc_fast_num"]], 0],
              0,
              4,
              2,
              6,
              8,
              10,
            ],
            "circle-color": [
              "case",
              [">", ["coalesce", ["to-number", ["get", "ev_dc_fast_num"]], 0], 0],
              "#1f6f9b",
              "#2d9fc4",
            ],
            "circle-opacity": 0.86,
            "circle-stroke-color": "#ffffff",
            "circle-stroke-width": 1,
          },
        });
      }

      function wireControls() {
        tractMetricEl.addEventListener("change", (event) => {
          activeTractMetric = event.target.value;
          updateTractPaint();
          updateLegend();
        });

        document.getElementById("tractsToggle").addEventListener("change", (event) => {
          setLayerVisibility(["tracts-fill", "tracts-outline"], event.target.checked);
        });

        document.getElementById("evToggle").addEventListener("change", (event) => {
          setLayerVisibility(["ev-points"], event.target.checked);
        });

        document.getElementById("solarToggle").addEventListener("change", (event) => {
          setLayerVisibility(["solar-fill", "solar-outline"], event.target.checked);
        });

        document.getElementById("ejToggle").addEventListener("change", (event) => {
          setLayerVisibility(["ej-fill", "ej-outline"], event.target.checked);
        });

        document.getElementById("tractOpacity").addEventListener("input", (event) => {
          map.setPaintProperty("tracts-fill", "fill-opacity", Number(event.target.value));
        });
      }

      function setLayerVisibility(layerIds, visible) {
        for (const id of layerIds) {
          map.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
        }
      }

      function updateTractPaint() {
        const metric = tractMetrics[activeTractMetric];
        const expression = ["interpolate", ["linear"], ["coalesce", ["to-number", ["get", activeTractMetric]], -9999]];
        for (let i = 0; i < metric.stops.length; i += 1) {
          expression.push(metric.stops[i], metric.colors[i]);
        }
        map.setPaintProperty("tracts-fill", "fill-color", expression);
      }

      function updateLegend() {
        const metric = tractMetrics[activeTractMetric];
        legendEl.innerHTML = "";
        metric.stops.forEach((stop, index) => {
          const row = document.createElement("div");
          row.className = "legend-row";
          row.innerHTML = `
            <span class="swatch" style="background:${metric.colors[index]}"></span>
            <span>${index === 0 ? "Lowest" : metric.format(stop)}</span>
          `;
          legendEl.appendChild(row);
        });

        const extra = [
          ["#2d9fc4", "EV charging station"],
          ["#1f6f9b", "DC fast charging available"],
          ["rgba(184,77,93,0.35)", "Environmental justice block group"],
          ["#d79b2b", "Higher municipal solar capacity"],
        ];
        for (const [color, label] of extra) {
          const row = document.createElement("div");
          row.className = "legend-row";
          row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${label}</span>`;
          legendEl.appendChild(row);
        }
      }

      function addInteractions() {
        addPopup("tracts-fill", (p) => `
          <p class="popup-title">${escapeHtml(p.NAMELSAD || "Census tract")}</p>
          ${popupRow("County", p.greater_boston_county)}
          ${popupRow("SVI percentile", percentRank(p.svi_rpl_themes))}
          ${popupRow("Median income", currency(p.median_household_income))}
          ${popupRow("Poverty rate", percent(p.poverty_rate))}
          ${popupRow("Renter rate", percent(p.renter_rate))}
          ${popupRow("No vehicle rate", percent(p.no_vehicle_rate))}
          ${popupRow("Multifamily share", percent(p.multifamily_share))}
        `);

        addPopup("ev-points", (p) => `
          <p class="popup-title">${escapeHtml(p.station_name || "EV charging station")}</p>
          ${popupRow("Address", [p.street_address, p.city, p.zip].filter(Boolean).join(", "))}
          ${popupRow("Network", p.ev_network)}
          ${popupRow("Level 2 ports", number(p.ev_level2_evse_num))}
          ${popupRow("DC fast ports", number(p.ev_dc_fast_num))}
          ${popupRow("Access", p.groups_with_access_code)}
        `);

        addPopup("solar-fill", (p) => `
          <p class="popup-title">${escapeHtml(titleCase(p.TOWN || "Municipality"))}</p>
          ${popupRow("County", titleCase(p.COUNTY))}
          ${popupRow("Solar projects", number(p.solar_project_count))}
          ${popupRow("Residential projects", number(p.residential_solar_project_count))}
          ${popupRow("Solar capacity", `${number(p.solar_capacity_dc_mw)} MW`)}
          ${popupRow("Estimated production", `${number(p.estimated_annual_production_kwh)} kWh`)}
        `);

        addPopup("ej-fill", (p) => `
          <p class="popup-title">${escapeHtml(p.GEOGRAPHIC || "EJ block group")}</p>
          ${popupRow("Municipality", p.MUNICIPALI)}
          ${popupRow("EJ", p.EJ)}
          ${popupRow("Criteria", p.EJ_CRIT_DE)}
          ${popupRow("Minority share", `${number(p.PCT_MINORI)}%`)}
          ${popupRow("Median household income", currency(p.BG_MHHI))}
        `);

        for (const id of ["tracts-fill", "ev-points", "solar-fill", "ej-fill"]) {
          map.on("mouseenter", id, () => {
            map.getCanvas().style.cursor = "pointer";
          });
          map.on("mouseleave", id, () => {
            map.getCanvas().style.cursor = "";
          });
        }
      }

      function addPopup(layerId, renderHtml) {
        map.on("click", layerId, (event) => {
          const feature = event.features && event.features[0];
          if (!feature) return;
          new maplibregl.Popup({ maxWidth: "360px" })
            .setLngLat(event.lngLat)
            .setHTML(renderHtml(feature.properties))
            .addTo(map);
        });
      }

      function fitToData(geojson) {
        const bounds = new maplibregl.LngLatBounds();
        for (const feature of geojson.features) {
          extendBounds(bounds, feature.geometry.coordinates);
        }
        map.fitBounds(bounds, { padding: 48, duration: 0 });
      }

      function extendBounds(bounds, coordinates) {
        if (typeof coordinates[0] === "number") {
          bounds.extend(coordinates);
          return;
        }
        for (const item of coordinates) {
          extendBounds(bounds, item);
        }
      }

      function popupRow(label, value) {
        const display = value === null || value === undefined || value === "" ? "No data" : value;
        return `<div class="popup-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(display)}</strong></div>`;
      }

      function percent(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return "No data";
        return `${Math.round(num * 1000) / 10}%`;
      }

      function percentRank(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return "No data";
        return `${Math.round(num * 100)}th percentile`;
      }

      function currency(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return "No data";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        }).format(num);
      }

      function number(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return "0";
        return new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 }).format(num);
      }

      function titleCase(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
